name: Update base image (python)

# Daily (and on demand): bumps the python base image
# (FROM python:3.x-slim) to the latest 3.x-slim tag and opens/updates a
# single PR (branch bot/update-base-image, label "dependencies") which is
# auto-merged by the dependabot-automerge workflow.
#
# Replaces the (slow, rate-limited) Dependabot docker updates for the FROM line.

on:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-base-image
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Detect latest python
        id: detect
        run: |
          set -euo pipefail
          LAT=$(curl -fsSL "https://hub.docker.com/v2/repositories/library/python/tags?name=3&page_size=100&ordering=last_updated" \
            | python3 -c "import sys,json,re; tags=[t['name'] for t in json.load(sys.stdin)['results']]; f=[t for t in tags if re.fullmatch(r'3\.\d+-slim',t)]; print(sorted(f,key=lambda x:[int(i) for i in x.split('-')[0].split('.')])[-1].split('-')[0])")
          echo "image_latest=$LAT" >> "$GITHUB_OUTPUT"

      - name: Apply bump and open/update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMG_LATEST: ${{ steps.detect.outputs.image_latest }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          CUR=$(sed -n 's/^FROM python:\([0-9.]*\)-slim.*/\1/p' Dockerfile | head -1)
          if [[ -z "${IMG_LATEST:-}" || "$IMG_LATEST" == "$CUR" ]]; then
            echo "Niets te doen: python=$CUR (actueel)."
            exit 0
          fi

          BRANCH="bot/update-base-image"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # De repo-ruleset blokkeert force-push (non_fast_forward) en
          # branch-verwijdering (deletion). Hergebruik de branch met
          # fast-forward-only pushes: merge main erin, bump-commit erbovenop.
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch $BRANCH bestaat; synchroniseren met main."
            git fetch origin "$BRANCH" origin/main
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main || { echo "Merge-conflict met main; abort."; git merge --abort; exit 1; }
          else
            echo "Nieuwe branch $BRANCH vanaf main."
            git checkout -b "$BRANCH" origin/main
          fi

          sed -i "s#^FROM python:${CUR}-slim#FROM python:${IMG_LATEST}-slim#" Dockerfile
          git add Dockerfile
          git commit -m "chore(deps): bump python base to ${IMG_LATEST}-slim"
          git push origin "$BRANCH" || { echo "Push geweigerd (ruleset?)."; exit 1; }

          TITLE="chore(deps): python ${CUR}-slim -> ${IMG_LATEST}-slim"
          BODY=$(printf 'Automatische update door de update-base-image workflow.\n\n- python base: python:%s-slim -> python:%s-slim\n\nDe auto-merge workflow merged dit automatisch (squash).' "$CUR" "$IMG_LATEST")
          if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --title "$TITLE" --body "$BODY" --add-label dependencies
            echo "Bestaande PR bijgewerkt (branch $BRANCH)."
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" --label dependencies
            echo "Nieuwe PR aangemaakt (branch $BRANCH)."
          fi
